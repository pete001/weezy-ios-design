<a href="RELEASE.json">Release status</a> · <a href="manifest.json">Manifest</a></p><h2>Fresh captures</h2><p>Tap a screen to review it full-screen and add contextual notes. Notes stay local until exported.</p><button class="export">Export review notes</button><section class="gallery"><button class="card" data-id="B-03-share-card" data-src="B-03-share-card.jpg"><img loading="lazy" src="B-03-share-card.jpg" alt="B-03-share-card"><span>B-03-share-card</span></button><button class="card" data-id="M-06-sync-zero" data-src="M-06-sync-zero.jpg"><img loading="lazy" src="M-06-sync-zero.jpg" alt="M-06-sync-zero"><span>M-06-sync-zero</span></button><button class="card" data-id="OFFLINE-REGISTRATION" data-src="OFFLINE-REGISTRATION.jpg"><img loading="lazy" src="OFFLINE-REGISTRATION.jpg" alt="OFFLINE-REGISTRATION"><span>OFFLINE-REGISTRATION</span></button><button class="card" data-id="M-07-registration-history" data-src="M-07-registration-history.jpg"><img loading="lazy" src="M-07-registration-history.jpg" alt="M-07-registration-history"><span>M-07-registration-history</span></button><button class="card" data-id="O-01-your-name-largest-keyboard" data-src="O-01-your-name-largest-keyboard.jpg"><img loading="lazy" src="O-01-your-name-largest-keyboard.jpg" alt="O-01-your-name-largest-keyboard"><span>O-01-your-name-largest-keyboard</span></button><button class="card" data-id="O-01-your-name-largest-keyboard-small" data-src="O-01-your-name-largest-keyboard-small.jpg"><img loading="lazy" src="O-01-your-name-largest-keyboard-small.jpg" alt="O-01-your-name-largest-keyboard-small"><span>O-01-your-name-largest-keyboard-small</span></button><button class="card" data-id="B-04-badge-web-page" data-src="B-04-badge-web-page.jpg"><img loading="lazy" src="B-04-badge-web-page.jpg" alt="B-04-badge-web-page"><span>B-04-badge-web-page</span></button><button class="card" data-id="B-04-badge-web-page-more" data-src="B-04-badge-web-page-more.jpg"><img loading="lazy" src="B-04-badge-web-page-more.jpg" alt="B-04-badge-web-page-more"><span>B-04-badge-web-page-more</span></button></section></main><dialog id="viewer"><div class="controls"><button id="prev">Previous</button><button id="next">Next</button><button id="close">Close</button></div><div class="viewer"><img id="full" alt=""><div class="notes"><h2 id="screen-id"></h2><label for="note">Review notes</label><textarea id="note" placeholder="What should change on this screen?"></textarea><p>Saved on this browser only.</p></div></div></dialog><script>const cards=[...document.querySelectorAll('.card')],dialog=document.querySelector('dialog'),note=document.querySelector('#note');let index=0;const key='weezy-review54-notes';let notes={};try{notes=JSON.parse(localStorage.getItem(key)||'{}')}catch{}function show(i){index=(i+cards.length)%cards.length;const c=cards[index];document.querySelector('#full').src=c.dataset.src;document.querySelector('#full').alt=c.dataset.id;document.querySelector('#screen-id').textContent=c.dataset.id;note.value=notes[c.dataset.id]||'';if(!dialog.open)dialog.showModal()}cards.forEach((c,i)=>c.onclick=()=>show(i));document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#close').onclick=()=>dialog.close();note.oninput=()=>{notes[cards[index].dataset.id]=note.value;localStorage.setItem(key,JSON.stringify(notes))};document.querySelector('.export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({build:54,notes},null,2)],{type:'application/json'}));a.href=url;a.download='review54-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
